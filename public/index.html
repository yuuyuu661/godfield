<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>トーナメント表</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <h1>🏆 トーナメント表</h1>
  <section>
    <form id="team-form">
      <input name="name" placeholder="チーム名" required>
      <input name="member1" placeholder="メンバー1">
      <input name="member2" placeholder="メンバー2">
      <input name="member3" placeholder="メンバー3">
      <input name="password" type="password" placeholder="管理パスワード" required>
      <button type="submit">登録</button>
    </form>
    <button id="start">大会開始</button>
  </section>

  <section id="teams"></section>
  <section id="bracket"></section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/api.js"></script>
  <script type="module" src="/bracket.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
