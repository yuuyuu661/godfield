<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>トーナメントメーカー</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">TOURNAMENT CONTROL</p>
      <h1>トーナメントメーカー</h1>
    </div>
    <button id="resetButton" class="reset-button">トーナメント表リセット</button>
  </header>

  <main>
    <section class="setup card">
      <div>
        <span class="step">01</span>
        <h2>参加人数から表を作る</h2>
        <p>12〜32人を入力すると、シードとBYEを含む表を自動生成します。</p>
      </div>
      <form id="setupForm">
        <label for="participantCount">参加人数</label>
        <input id="participantCount" type="number" min="12" max="32" value="16" required>
        <button type="submit">トーナメント表を作成</button>
      </form>
    </section>

    <section id="rouletteCard" class="roulette card" hidden>
      <div class="section-heading">
        <div><span class="step">02</span><h2>ルーレットで枠を決める</h2></div>
        <p id="allocationStatus"></p>
      </div>
      <div class="roulette-layout">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel" width="520" height="520"></canvas>
          <button id="spinButton" class="spin-button">回す</button>
        </div>
        <div class="roulette-controls">
          <label for="names">プレイヤー名（「,」区切りで一斉登録）</label>
          <textarea id="names" rows="6" placeholder="プレイヤーA, プレイヤーB, プレイヤーC"></textarea>
          <div class="control-row">
            <button id="loadNames" type="button">ルーレットに登録</button>
            <label>登録先
              <select id="targetSeed"></select>
            </label>
          </div>
          <div id="rouletteResult" class="roulette-result">名前を登録してください</div>
          <p class="hint">停止したプレイヤーは選択中の枠へ登録され、ルーレットから自動で削除されます。</p>
        </div>
      </div>
    </section>

    <section id="bracketSection" class="bracket-section" hidden>
      <div class="section-heading">
        <div><span class="step">03</span><h2>トーナメント表</h2></div>
        <p>対戦カードのプレイヤー名を押すと勝者を登録できます。</p>
      </div>
      <div id="bracket" class="bracket"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
