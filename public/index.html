<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>トーナメント管理（26チーム＋最適シード＋あとから登録）</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>トーナメント管理</h1>
    <div class="status">
      <span id="status">状態: 読み込み中...</span>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>管理</h2>
      <div class="row">
        <label>管理パスワード</label>
        <input id="admin-pass" type="password" placeholder="••••" />
      </div>

      <div class="row">
        <label>ターゲット枠（26推奨／2の冪に切り上げ）</label>
        <input id="target-size" type="number" min="2" max="32" value="26" />
      </div>

      <div class="row buttons">
        <button id="start-btn">大会開始（表を作成＝seeding）</button>
        <button id="go-live-btn">ライブ開始（BYE自動処理）</button>
        <button id="reset-btn" class="danger">リセット</button>
      </div>
    </section>

    <section class="card">
      <h2>チーム登録（seeding中は枠に自動配置）</h2>
      <div class="row">
        <label>チーム名</label>
        <input id="team-name" type="text" placeholder="チーム名" />
      </div>
      <div class="row">
        <div>
          <label>メンバー1</label>
          <input id="mem1" type="text" />
        </div>
        <div>
          <label>メンバー2</label>
          <input id="mem2" type="text" />
        </div>
        <div>
          <label>メンバー3</label>
          <input id="mem3" type="text" />
        </div>
      </div>
      <div class="row buttons">
        <button id="add-team">追加</button>
      </div>

      <h3>登録チーム</h3>
      <ul id="teams"></ul>
    </section>

    <section class="card wide">
      <h2>トーナメント表（モバイル対応SVG）</h2>
      <div id="bracket"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
