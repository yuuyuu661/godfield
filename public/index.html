<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>32チーム・トーナメント</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>32チーム・シングルエリミネーション</h1>
  </header>

  <section id="admin">
    <details open>
      <summary>管理パネル</summary>
      <div class="admin-grid">
        <label>管理パスワード <input id="pass" type="password" placeholder="••••" /></label>
        <div class="add-team">
          <input id="teamName" type="text" placeholder="チーム名" />
          <button id="addTeam">登録</button>
        </div>
        <div class="seed-actions">
          <button id="seedAll">全チーム ランダム配置</button>
          <button id="clearSeeds" class="danger">配置クリア</button>
          <button id="resetResults" class="danger">勝敗リセット</button>
        </div>
        <div class="edit-list">
          <div id="teamsList"></div>
        </div>
        <div>
          <small>ルーレット：1回戦の枠をタップ → [この枠にルーレット]</small><br/>
          <button id="rouletteBtn" disabled>この枠にルーレット</button>
        </div>
      </div>
    </details>
  </section>

  <main id="bracket">
    <svg id="wires" aria-hidden="true"></svg>
    <div id="cols" class="columns"></div>
  </main>

  <template id="matchTpl">
    <div class="match" data-match>
      <label class="row" data-side="A">
        <input type="radio" name="w" />
        <span class="seed"></span>
        <span class="name">--</span>
      </label>
      <label class="row" data-side="B">
        <input type="radio" name="w" />
        <span class="seed"></span>
        <span class="name">--</span>
      </label>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
